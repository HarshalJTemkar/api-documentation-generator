version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - apidocgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pull correct models
  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - apidocgen-network
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama to be ready...' &&
      sleep 10 &&
      echo 'Pulling llama3.2:latest...' &&
      ollama pull llama3.2:latest &&
      echo 'Model pulled successfully!' &&
      ollama list
      "
    restart: "no"

volumes:
  ollama-data:
    driver: local

networks:
  apidocgen-network:
    driver: bridge